function seededRand(seed) {
  let s = seed;
  return () => {s = s * 1664525 + 1013904223 & 0xffffffff;return (s >>> 0) / 0xffffffff;};
}

function generateQRMatrix(seed, size = 25) {
  const rand = seededRand(seed);
  const m = Array.from({ length: size }, () => Array(size).fill(0));
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    const inTL = r < 9 && c < 9,inTR = r < 9 && c >= size - 8,inBL = r >= size - 8 && c < 9;
    if (!inTL && !inTR && !inBL) m[r][c] = rand() > 0.48 ? 1 : 0;
  }
  const drawFinder = (row, col) => {
    for (let dr = 0; dr < 7; dr++) for (let dc = 0; dc < 7; dc++) {
      const onB = dr === 0 || dr === 6 || dc === 0 || dc === 6,onI = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
      m[row + dr][col + dc] = onB || onI ? 1 : 0;
    }
  };
  drawFinder(0, 0);drawFinder(0, size - 7);drawFinder(size - 7, 0);
  for (let i = 8; i < size - 8; i++) {m[6][i] = i % 2 === 0 ? 1 : 0;m[i][6] = i % 2 === 0 ? 1 : 0;}
  return m;
}

function QRCodeSVG({ seed, size = 240, fading = false }) {
  const matrix = generateQRMatrix(seed);
  const n = matrix.length;
  const cs = size / n;
  const r = Math.max(1, cs * 0.18);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
    style={{ display: 'block', opacity: fading ? 0.15 : 1, transition: 'opacity 0.4s ease' }}>
      {matrix.map((row, ri) => row.map((v, ci) => v ?
      <rect key={`${ri}-${ci}`} x={ci * cs + 0.5} y={ri * cs + 0.5}
      width={cs - 1} height={cs - 1} rx={r} ry={r} fill="#0D1B2A" /> :
      null))}
    </svg>);

}

function CountdownRing({ seconds, total, ringSize, accent }) {
  const stroke = 8;
  const rad = (ringSize - stroke) / 2;
  const circ = 2 * Math.PI * rad;
  const dash = circ * (seconds / total);
  const ringColor = seconds <= 5 ? '#EF4444' : seconds <= 10 ? '#F59E0B' : accent;
  return (
    <svg width={ringSize} height={ringSize}
    style={{ position: 'absolute', top: 0, left: 0, transform: 'rotate(-90deg)' }}>
      <circle cx={ringSize / 2} cy={ringSize / 2} r={rad} fill="none" stroke="#E2E8F0" strokeWidth={stroke} />
      <circle cx={ringSize / 2} cy={ringSize / 2} r={rad} fill="none"
      stroke={ringColor} strokeWidth={stroke} strokeLinecap="round"
      strokeDasharray={`${dash} ${circ}`}
      style={{ transition: 'stroke-dasharray 0.95s linear, stroke 0.3s ease' }} />
    </svg>);

}

    if (paused || sessionEnded) return;
    const t = setInterval(() => setElapsed((e) => e + 1), 1000);
    return () => clearInterval(t);
  }, [paused, sessionEnded]);

    if (paused || sessionEnded) return;

      setSeconds((s) => {
        if (s <= 1) {
          setFading(true);
          setTimeout(() => {
            setQrSeed(Date.now() + Math.random() * 1e6);
            setEntryCodeIdx((i) => (i + 1) % ENTRY_CODES.length);
            setGeneration((g) => g + 1);
            setFading(false);

          return TOTAL;

          }

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#DCFCE7', border: '1px solid #BBF7D0', borderRadius: 100, padding: '7px 20px' }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#22C55E', boxShadow: '0 0 8px #22C55E80', animation: 'pulse 1.5s ease-in-out infinite' }} />
            <span style={{ fontSize: 13, fontWeight: 700, color: '#15803D', letterSpacing: '0.5px' }}>SESSION ACTIVE</span>
          </div>

          <div style={{ textAlign: 'center', marginTop: -8 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-faint)', letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: 6 }}>
              Dynamic QR · Generation #{generation}
            </div>
            <h1 style={{ fontSize: 22, fontWeight: 800, letterSpacing: '-0.5px', color: 'var(--text)' }}>
              สแกน QR เพื่อเช็คชื่อเข้าเรียน
            </h1>
          </div>

          <div style={{ position: 'relative', width: RING_SIZE, height: RING_SIZE, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <CountdownRing seconds={seconds} total={TOTAL} ringSize={RING_SIZE} accent={accent} />

            <div style={{
              width: QR_CARD, height: QR_CARD,
              background: 'white', borderRadius: 20,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 4px 24px rgba(0,0,0,0.10), 0 0 0 1px var(--border)',
              position: 'relative'
            }}>
              <div style={{ padding: 12, opacity: paused ? 0.35 : 1, transition: 'opacity 0.3s' }}>
                <QRCodeSVG seed={qrSeed} size={QR_CARD - 28} fading={fading} />
              </div>
              {fading && <div style={{ position: 'absolute', inset: 0, background: 'white', borderRadius: 20, opacity: 0.7 }} />}
            </div>

            {/* Countdown badge */}
            <div style={{
              position: 'absolute', bottom: -16, left: '50%', transform: 'translateX(-50%)',
              background: 'white',
              border: `1.5px solid ${seconds <= 5 ? '#FECACA' : seconds <= 10 ? '#FDE68A' : 'var(--border)'}`,
              borderRadius: 100, padding: '6px 18px',
              display: 'flex', alignItems: 'center', gap: 8,
              boxShadow: '0 2px 8px rgba(0,0,0,0.08)', transition: 'border-color 0.3s'
            }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={ringColor} strokeWidth="2.5">
                <circle cx="12" cy="12" r="10" /><polyline points="12,6 12,12 16,14" />
              </svg>
              <span style={{ fontFamily: 'JetBrains Mono,monospace', fontSize: 14, fontWeight: 700, color: ringColor, letterSpacing: '1px' }}>
                {String(seconds).padStart(2, '0')}s
              </span>
              <span style={{ fontSize: 12, color: 'var(--text-faint)' }}>รีเฟรช</span>
            </div>
          </div>

          {tweaks.showEntryCode &&
          <div style={{
            background: 'white', border: '1.5px solid var(--border)',
            borderRadius: 18, padding: '18px 44px', textAlign: 'center',
            width: '100%', maxWidth: 430,
            boxShadow: '0 2px 8px rgba(0,0,0,0.05)'
          }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-faint)', letterSpacing: '1.5px', marginBottom: 10, textTransform: 'uppercase' }}>
                Entry Code — กรอกแทน QR ได้
              </div>
              <div style={{
              fontFamily: 'JetBrains Mono,monospace', fontSize: 34, fontWeight: 700,
              letterSpacing: '8px', color: 'var(--text)',
              animation: fading ? 'codeFlip 0.4s ease' : 'none'
            }}>
                {ENTRY_CODES[entryCodeIdx]}
              </div>
              <div style={{ marginTop: 8, fontSize: 13, color: 'var(--text-faint)' }}>รหัสจะเปลี่ยนพร้อมกับ QR Code</div>
            </div>
          }
            </section>

            <aside style={{
              background: 'var(--white)', border: '1px solid var(--border)', borderRadius: 16,
              boxShadow: '0 14px 28px rgba(15,23,42,0.08)', display: 'flex',
              flexDirection: 'column', overflow: 'hidden', minHeight: 760
            }}>
              <div style={{ padding: '24px 24px 18px', borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: 'var(--text-faint)', letterSpacing: '1.2px', marginBottom: 14, textTransform: 'uppercase' }}>
                  สถิติการเข้าเรียน
                </div>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8, marginBottom: 14 }}>
                  <span style={{ fontSize: 52, fontWeight: 800, lineHeight: 1, color: 'var(--text)', fontFamily: 'Inter' }}>{checkedIn.length}</span>
                  <span style={{ fontSize: 22, color: 'var(--text-faint)', fontWeight: 500, marginBottom: 6 }}>/ {totalStudents}</span>
                </div>
                <div style={{ height: 8, background: 'var(--bg)', borderRadius: 99, overflow: 'hidden', marginBottom: 10, border: '1px solid var(--border)' }}>
              <div style={{
                height: '100%', borderRadius: 99,
                width: `${progressPct}%`,
                background: `linear-gradient(90deg, ${accent}, ${accent}CC)`,
                transition: 'width 0.6s cubic-bezier(0.34,1.1,0.64,1)'
              }} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
              <span style={{ color: '#16A34A', fontWeight: 600 }}>เข้าเรียน {checkedIn.length} คน</span>
              <span style={{ color: 'var(--text-faint)' }}>ขาด {totalStudents - checkedIn.length} คน</span>
            </div>
              </div>

          <div style={{ padding: '16px 24px 8px' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-faint)', letterSpacing: '1.2px', textTransform: 'uppercase' }}>เข้าเรียนล่าสุด</div>
          </div>

          <div style={{ flex: 1, overflowY: 'auto', padding: '0 24px 24px' }}>
            {[...checkedIn].reverse().map((s, i) =>
            <div key={s.id} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0',
              borderBottom: '1px solid var(--border)',
              animation: i === 0 && s.id > 6 ? 'slideInNew 0.4s cubic-bezier(0.34,1.56,0.64,1)' : 'none'
            }}>
                <div style={{
                width: 34, height: 34, borderRadius: 10,
                background: `${accent}12`, border: `1.5px solid ${accent}30`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 13, fontWeight: 700, color: accent, flexShrink: 0
              }}>
                  {s.name.charAt(0)}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 1 }}>{fmtClock(s.time)}</div>
                </div>
                <div style={{ width: 18, height: 18, borderRadius: '50%', background: '#16A34A', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20,6 9,17 4,12" /></svg>
                </div>
              </div>
            )}
          </div>
            </aside>
          </div>
        </div>
      </main>

      {toast && <CheckinToast name={toast} onDone={() => setToast(null)} />}

      {showTweaks &&
      <div style={{
        position: 'fixed', bottom: 24, right: 24, width: 260,
        background: 'white', borderRadius: 16, boxShadow: '0 8px 32px rgba(0,0,0,0.15)',
        padding: 20, zIndex: 999, border: '1px solid var(--border)', fontFamily: 'Sarabun,sans-serif'
      }}>
          <h4 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16, color: 'var(--text)' }}>Tweaks</h4>
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>Accent Color</label>
            <div style={{ display: 'flex', gap: 8 }}>
              {['#CC0000', '#2563EB', '#059669', '#7C3AED', '#D97706'].map((c) =>
            <button key={c} onClick={() => updateTweak('accentColor', c)} style={{
              width: 28, height: 28, borderRadius: 8, background: c, border: 'none', cursor: 'pointer',
              outline: tweaks.accentColor === c ? `3px solid ${c}` : 'none', outlineOffset: 2
            }} />
            )}
            </div>
          </div>
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>
              Refresh ทุก: <span style={{ color: 'var(--text)' }}>{tweaks.refreshInterval}s</span>
            </label>
            <input type="range" min={10} max={60} step={5} value={tweaks.refreshInterval}
          onChange={(e) => updateTweak('refreshInterval', +e.target.value)}
          style={{ width: '100%', accentColor: tweaks.accentColor }} />
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--text-faint)', marginTop: 4 }}>
              <span>10s</span><span>60s</span>
            </div>
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>แสดง Entry Code</label>
            <button onClick={() => updateTweak('showEntryCode', !tweaks.showEntryCode)} style={{
            padding: '6px 14px', borderRadius: 8,
            border: `2px solid ${tweaks.showEntryCode ? accent : 'var(--border)'}`,
            background: tweaks.showEntryCode ? accent : 'white',
            color: tweaks.showEntryCode ? 'white' : 'var(--text)',
            cursor: 'pointer', fontSize: 13, fontFamily: 'Sarabun,sans-serif', fontWeight: 600, transition: 'all 0.2s'
          }}>
              {tweaks.showEntryCode ? 'เปิด' : 'ปิด'}
            </button>
          </div>
        </div>
      }

      <style>{`
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
        @keyframes slideInRight{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes slideInNew{from{transform:translateY(-10px) scale(0.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        @keyframes codeFlip{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
      `}</style>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
